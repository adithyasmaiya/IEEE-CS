<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0A0A0A" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(242,238,230,0.12)" stroke-width="1" />
  
  <!-- Subtle grid lines -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="rgba(242,238,230,0.12)" stroke-width="1" />
  <line x1="32" y1="12" x2="32" y2="52" stroke="rgba(242,238,230,0.12)" stroke-width="1" />
  
  <!-- Orbital Geometry -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#C8FF2E" stroke-width="1.5" transform="rotate(-30 32 32)" />
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="rgba(242,238,230,0.5)" stroke-width="1" transform="rotate(30 32 32)" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(242,238,230,0.2)" stroke-width="1" stroke-dasharray="2 3" />
  
  <!-- Central Convergence Core -->
  <circle cx="32" cy="32" r="3.5" fill="#C8FF2E" />
  <circle cx="32" cy="32" r="6.5" fill="none" stroke="#C8FF2E" stroke-width="0.75" opacity="0.6" />
</svg>
